 sans-serif" font-size="16" font-weight="600" fill="#785008" text-anchor="start">No pudimos confirmar la</text><text x="496" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#785008" text-anchor="start">operación</text><text x="496" y="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B5141" text-anchor="start">Puede que se haya realizado.</text><text x="496" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B5141" text-anchor="start">Revisa antes de repetirla.</text><rect x="448" y="428" width="131" height="40" rx="6" fill="#FFFFFF" stroke="#739797" stroke-width="1"/><text x="513.5" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B5141" text-anchor="middle">Reintentar</text><rect x="591" y="428" width="91" height="40" rx="6" fill="#FFFFFF" stroke="#739797" stroke-width="1"/><text x="636.5" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B5141" text-anchor="middle">Cerrar</text><text x="864" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#405656" text-anchor="start">Ambiguo tras Cerrar</text><rect x="864" y="206" width="360" height="100" rx="8" fill="#FDF4E2"/><g transform="translate(880,222)" fill="none" stroke="#785008" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5 L18 16.5 H2 Z"/><line x1="10" y1="8" x2="10" y2="11.5"/><line x1="10" y1="14" x2="10.01" y2="14"/></g><text x="912" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B5141" text-anchor="start">No sabemos si la operación se</text><text x="912" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B5141" text-anchor="start">realizó; revísalo antes de</text><text x="912" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B5141" text-anchor="start">repetirla.</text><text x="32" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#405656" text-anchor="start">Rechazado (comandos, 4xx) — textos de 409 PENDIENTES</text><rect x="32" y="312" width="360" height="52" rx="8" fill="#FEF3F2"/><g transform="translate(48,328)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><line x1="7" y1="7" x2="13" y2="13"/><line x1="13" y1="7" x2="7" y2="13"/></g><text x="80" y="342" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#B42318" text-anchor="start">Texto: PENDIENTE (por código)</text><text x="448" y="508" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#405656" text-anchor="start">Éxito (comandos) — PENDIENTE donde falte contrato</text><rect x="448" y="520" width="360" height="52" rx="8" fill="#EEF6EF"/><g transform="translate(464,536)" fill="none" stroke="#1B5141" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><polyline points="6.5,10.5 9,13 13.5,7.5"/></g><text x="496" y="550" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B5141" text-anchor="start">Texto: PENDIENTE (por comando)</text><text x="864" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#405656" text-anchor="start">Sesión expirada — brand-blue-50 / brand-blue-800</text><rect x="864" y="358" width="360" height="76" rx="8" fill="#EBF5F9"/><g transform="translate(880,374)" fill="none" stroke="#255E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><line x1="10" y1="9" x2="10" y2="14"/><line x1="10" y1="6" x2="10.01" y2="6"/></g><text x="912" y="388" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#255E79" text-anchor="start">Tu sesión expiró. Vuelve a</text><text x="912" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#255E79" text-anchor="start">iniciar sesión.</text><text x="32" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#405656" text-anchor="start">Sin entradas (EmptyState)</text><rect x="32" y="416" width="360" height="76" rx="8" fill="#FFFFFF" stroke="#E2E9E9" stroke-width="1"/><text x="48" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#405656" text-anchor="start">No hay opciones disponibles para tu</text><text x="48" y="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#405656" text-anchor="start">cuenta en este panel.</text></svg>